<title>MAUROMEN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — sticky top bar, content column (max 880px), bottom tab bar on phones, side rail on wide screens */
/* Palette: white / black / green. Green carries action and progress; black carries structure (top bar, chips) */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f3f6f4; --ink:#0a0f0c; --muted:#5b665f; --line:#e1e7e3;
  --accent:#13a052; --accent-soft:#e3f6ea; --leaf:#0e7a3e; --leaf-soft:#dff3e6; --sky:#0f766e; --sky-soft:#dcf1ee;
  --bar:#0a0f0c; --bar-ink:#ffffff;
  --warn:#a16207; --warn-soft:#fbf1d9; --bad:#c0262d; --bad-soft:#fbe3e3;
  --display:'Bricolage Grotesque', 'Inter', system-ui, sans-serif; --body:'Inter', system-ui, -apple-system, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#0f1311; --surface-2:#171c19; --ink:#f2f6f3; --muted:#9aa69f; --line:#252c28;
  --accent:#2fd174; --accent-soft:#0f2a1b; --leaf:#4ade80; --leaf-soft:#11281a; --sky:#2dd4bf; --sky-soft:#0c2623;
  --bar:#000000; --bar-ink:#ffffff;
  --warn:#e6b450; --warn-soft:#2e2510; --bad:#ff6b6b; --bad-soft:#331616; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0f1311; --surface-2:#171c19; --ink:#f2f6f3; --muted:#9aa69f; --line:#252c28;
  --accent:#2fd174; --accent-soft:#0f2a1b; --leaf:#4ade80; --leaf-soft:#11281a; --sky:#2dd4bf; --sky-soft:#0c2623;
  --bar:#000000; --bar-ink:#ffffff;
  --warn:#e6b450; --warn-soft:#2e2510; --bad:#ff6b6b; --bad-soft:#331616; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em}
.brand b{color:var(--accent)}
.top .when{margin-left:auto;font-size:13px;opacity:.75;text-align:right}
.sync{font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.12);color:var(--bar-ink)}

.shell{display:flex;max-width:1120px;margin:0 auto}
.rail{display:none}
main{flex:1;min-width:0;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--accent)}
@media (min-width:900px){
  .tabs{display:none}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:70px;align-self:flex-start;padding:16px 0 16px max(16px,env(safe-area-inset-left,0px));width:190px}
  .rail a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600}
  .rail a svg{width:20px;height:20px}
  .rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  main{padding-bottom:40px}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:19px}
.card h3{font-size:16px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr 1fr;gap:6px}}

.btn{text-decoration:none;display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.leaf{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--leaf-soft);color:var(--leaf)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.sky{background:var(--sky-soft);color:var(--sky)}

/* Now card */
.now{background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%);border-color:transparent}
.now .big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05}
.countdown{font-family:var(--display);font-weight:800;color:var(--accent);font-size:20px}

/* Rings */
.ring{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface-2);border-radius:12px;padding:10px 4px}
.ring svg{width:78px;height:78px}
.ring .v{font-weight:800;font-size:15px}
.ring .l{font-size:11.5px;color:var(--muted);font-weight:600;text-align:center}

/* Meals timeline */
.meal{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.meal .t{font-weight:700;font-size:13px;color:var(--muted)}
.meal .n{font-weight:700}
.meal .items{font-size:13px;color:var(--muted)}
.meal.done .n::after{content:" ✓";color:var(--leaf)}
.meal.current{background:var(--accent-soft);border-radius:10px;padding-inline:8px;border-top-color:transparent}

.water{display:flex;gap:6px;flex-wrap:wrap}
.water button{width:34px;height:42px;border-radius:8px 8px 12px 12px;border:2px solid var(--sky);background:transparent;padding:0}
.water button.on{background:var(--sky)}
.scale{display:flex;gap:6px}
.scale button{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700}
.scale button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.check{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);text-align:left;width:100%}
.check .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--leaf);flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.check.on .box{background:var(--leaf)}

/* Plan */
.mealtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.mealtabs button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-weight:600;font-size:13px}
.mealtabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.formula{display:flex;flex-wrap:wrap;gap:6px}
.formula span{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;padding:5px 10px;border-radius:8px}
.menu{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:8px 12px;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.menu .k{text-align:right;font-weight:800;color:var(--accent);white-space:nowrap}
.menu .k small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.menu p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.menu.new{border-style:dashed;border-color:var(--accent)}
.grp h4{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--leaf)}
.grp ul{margin:0;padding-left:18px;font-size:14px;columns:2;column-gap:20px}
@media (max-width:520px){.grp ul{columns:1}}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .ttl{font-weight:600}
.li .meta{font-size:13px;color:var(--muted)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;font-size:14px}

.stat{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--display);font-weight:800;font-size:24px}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:320px;height:auto}
.tip{background:var(--leaf-soft);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.tip .ic{font-family:var(--display);font-weight:800;font-size:22px;color:var(--leaf);line-height:1}
.alert{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px 14px;font-size:14px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px}
table.lab{width:100%;border-collapse:collapse;font-size:14px}
table.lab td,table.lab th{padding:8px 6px;border-top:1px solid var(--line);text-align:left}
table.lab th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tbl{overflow-x:auto}

dialog{border:0;border-radius:16px;padding:0;max-width:520px;width:calc(100% - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .in{padding:18px;display:flex;flex-direction:column;gap:12px;max-height:80vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.insight{padding:11px 12px;border-radius:12px;background:var(--surface-2);border-left:4px solid var(--accent);font-size:14px}
.insight.warn{border-left-color:var(--warn)}.insight.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.streak{font-family:var(--display);font-weight:800;font-size:44px;color:var(--accent);line-height:1}
.steps{display:flex;gap:4px}.steps span{flex:1;height:5px;border-radius:5px;background:var(--line)}.steps span.on{background:var(--accent)}
.opt{display:flex;flex-wrap:wrap;gap:8px}.opt button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px}
.opt button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.photos figure{margin:0;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.photos figcaption{font-size:12px;padding:6px 8px;color:var(--muted)}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hub button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left}
.hub button b{font-family:var(--display);font-size:17px}.hub button span{font-size:12.5px;color:var(--muted)}
.hub button:hover{border-color:var(--accent)}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.hero-art{border-radius:var(--r);overflow:hidden;background:var(--bar);color:var(--bar-ink);position:relative;padding:20px;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.hero-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.62}
.hero-art{min-height:150px}
.nowgrid{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.nowgrid .pic{width:min(150px,34vw);aspect-ratio:16/9;object-fit:cover;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.thumb{display:block;width:52px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin-bottom:4px}
.banner{width:100%;max-width:100%;aspect-ratio:21/9;object-fit:cover;border-radius:12px;max-height:180px}
.hero-art>*:not(img){position:relative}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
main>section{animation:rise .35s ease both}
@media (prefers-reduced-motion:reduce){main>section{animation:none}}
.mimg{width:72px;height:72px;object-fit:cover;border-radius:10px}
.eimg{width:84px;height:84px;object-fit:cover;border-radius:10px}
@media (max-width:420px){.menu{grid-template-columns:60px 1fr auto}.mimg{width:60px;height:60px}}
pre.ics{white-space:pre-wrap;font-size:11px;max-height:180px;overflow:auto;background:var(--surface-2);padding:10px;border-radius:10px}
</style>

function bogota(d=new Date()){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Bogota',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false,weekday:'short'}).formatToParts(d);const o={};p.forEach(x=>o[x.type]=x.value);if(o.hour==='24')o.hour='00';return {date:`${o.year}-${o.month}-${o.day}`,h:+o.hour,m:+o.minute,dow:new Date(`${o.year}-${o.month}-${o.day}T12:00:00`).getDay()}}

 return `<div class="ring"><svg viewBox="0 0 78 78" aria-hidden="true"><circle cx="39" cy="39" r="32" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="39" cy="39" r="32" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 39 39)"/></svg><div class="v num">${Math.round(val)}<span class="sub"> / ${goal}${unit}</span></div><div class="l">${label}</div></div>`}

const queues={};
function write(path,data){const q=queues[path]||Promise.resolve();queues[path]=q.then(async()=>{if(!S.db){toast('Sin conexión: el cambio no se guardó');return}try{await S.db.doc(path).set(data)}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await S.db.doc(path).set(data)}catch(e2){toast('No se pudo guardar. Revisa la conexión.')}}else if(e&&e.code==='quota_exceeded'){toast('Almacenamiento lleno.')}else toast('No se pudo guardar.')}});return queues[path]}

function weightMetrics(kg){const pre=+S.profile.preop||PROFILE.preop,nad=+S.profile.nadir||PROFILE.nadir;const bmi=kg/PROFILE.height**2;const twl=(pre-kg)/pre*100;const regain=(kg-nad)/(pre-nad)*100;return {bmi,twl,regain}}
function chart(ws){
 if(ws.length<2)return '<div class="empty">Con dos pesajes aparece la gráfica.</div>';
 const W=640,H=240,P={l:44,r:16,t:16,b:30};const xs=ws.map(w=>new Date(w.date+'T12:00:00').getTime());const ys=ws.map(w=>w.kg);
 const x0=Math.min(...xs),x1=Math.max(...xs);let y0=Math.floor(Math.min(...ys,PROFILE.nadir)-2),y1=Math.ceil(Math.max(...ys)+2);
 const X=t=>P.l+(x1===x0?0.5:(t-x0)/(x1-x0))*(W-P.l-P.r),Y=v=>P.t+(1-(v-y0)/(y1-y0))*(H-P.t-P.b);
 const step=Math.max(2,Math.ceil((y1-y0)/5/2)*2);let grid='';for(let v=Math.ceil(y0/step)*step;v<=y1;v+=step)grid+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
 const pts=ws.map((w,i)=>`${X(xs[i])},${Y(w.kg)}`).join(' ');const last=ws[ws.length-1];
 const nad=PROFILE.nadir>=y0?`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(PROFILE.nadir)}" y2="${Y(PROFILE.nadir)}" stroke="var(--leaf)" stroke-dasharray="5 4"/><text x="${W-P.r}" y="${Y(PROFILE.nadir)-5}" text-anchor="end" font-size="11" fill="var(--leaf)">Tu mejor peso: ${PROFILE.nadir} kg</text>`:'';
 return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso">${grid}${nad}<polyline points="${P.l},${H-P.b} ${pts} ${X(xs[xs.length-1])},${H-P.b}" fill="var(--accent-soft)" stroke="none" opacity=".7"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${ws.map((w,i)=>`<circle cx="${X(xs[i])}" cy="${Y(w.kg)}" r="${i===ws.length-1?5:3}" fill="var(--accent)"/>`).join('')}<text x="${X(xs[xs.length-1])}" y="${Y(last.kg)-10}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">${last.kg} kg</text><text x="${P.l}" y="${H-8}" font-size="11" fill="var(--muted)">${fmtDate(ws[0].date)}</text><text x="${W-P.r}" y="${H-8}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtDate(last.date)}</text></svg></div>`}

 {k:'sleepH',q:'¿Cuántas horas dormiste anoche?',opts:['Menos de 5','5','6','7','8','9 o más']},

 {k:'snore',q:'¿Roncaste o te despertaste ahogado?',opts:['No','No sé','A veces','Sí, seguido']},

function streak(){const done=d=>Object.values((S.days[d]||{}).meals||{}).filter(m=>m.done).length>=4;let d=today();if(!done(d))d=addDays(d,-1);let n=0;while(done(d)){n++;d=addDays(d,-1)}return n}
function insights(){
 const t=today(),y=addDays(t,-1),out=[],st=S.settings;
 const dy=S.days[y];if(dy){const tt=totals(dy);if(tt.p>0&&tt.p<GOAL.prot*0.8)out.push(['warn',`Ayer comiste ${Math.round(tt.p)} g de proteína. Te faltaron ${Math.round(GOAL.prot-tt.p)} g: hoy empieza cada comida por la proteína.`]);if(Object.keys(dy.meals||{}).length&&(dy.water||0)<6)out.push(['warn',`Ayer tomaste ${dy.water||0} vasos de agua. Con Wegovy, tomar poca agua empeora las náuseas y el estreñimiento.`])}
 const dosedToday=S.events.some(e=>e.kind==='wegovy'&&e.date===t);if(bogota().dow==st.wegovyDay&&!dosedToday)out.push(['',`Hoy toca Wegovy ${st.wegovyDose} mg. Cuando te la apliques, anótala en Agenda.`]);
 const doses=S.events.filter(e=>e.kind==='wegovy'&&e.date).map(e=>e.date).sort();if(doses.length){const nx=addDays(doses[0],28);if(nx>=t&&nx<=addDays(t,7))out.push(['',`El ${fmtDate(nx)} cumples 4 semanas con ${st.wegovyDose} mg. Pregúntale a tu médico si sube la dosis.`])}
 S.events.filter(e=>!e.done&&e.date===t&&e.time).forEach(e=>out.push(['',`Hoy ${e.time}: ${e.title}.`]));
 S.events.filter(e=>!e.done&&e.date===addDays(t,1)).forEach(e=>out.push(['',`Mañana${e.time?' '+e.time:''}: ${e.title}. Revisa qué debes llevar.`]));
 const ci=day(t).checkin;if(ci&&ci.nausea==='Fuerte')out.push(['bad','Marcaste náuseas fuertes. Si vomitas varias veces o no toleras líquidos, consulta hoy.']);
 if(ci&&ci.snore==='Sí, seguido')out.push(['warn','Marcaste ronquidos frecuentes. Cuéntaselo al especialista de sueño: tus glóbulos rojos salieron altos.']);
 if(ci&&ci.bowel==='Estreñido')out.push(['warn','Estreñimiento: sube el agua en sorbos, verduras y fruta entera. Si pasan 3 días, coméntalo con tu médico.']);
 return out}

function profileDialog(){const pr=S.profile||{};openDlg(`<h2>Perfil clínico</h2><div class="sub">Lo que tus médicos siempre preguntan. Llénalo una vez y actualízalo cuando algo cambie.</div><form id="prForm" class="form" style="grid-template-columns:1fr">${PROFILE_FIELDS.map(([k,l,t])=>`<label class="f">${esc(l)}${t==='textarea'?`<textarea id="pf-${k}" rows="2">${esc(pr[k]||'')}</textarea>`:`<input id="pf-${k}" type="${t}" ${t==='number'?'step="0.1"':''} value="${esc(pr[k]||'')}">`}</label>`).join('')}<div class="row"><button class="btn primary">Guardar perfil</button><button type="button" class="btn ghost" data-close="1">Cancelar</button></div></form>`)}
function checkinDialog(){if(!S.ci)S.ci={step:0,ans:{...(day(today()).checkin||{})}};const {step,ans}=S.ci,total=CHECKIN.length+1;
 const bar=`<div class="steps">${Array.from({length:total},(_,i)=>`<span class="${i<=step?'on':''}"></span>`).join('')}</div>`;
 if(step<CHECKIN.length){const c=CHECKIN[step];openDlg(`${bar}<div class="sub">Check-in de hoy · ${step+1} de ${total}</div><h2>${esc(c.q)}</h2><div class="opt">${c.opts.map(o=>`<button class="${ans[c.k]===o?'on':''}" data-ciopt="${esc(o)}">${esc(o)}</button>`).join('')}</div><div class="row">${step?'<button class="btn ghost" data-ciback="1">Atrás</button>':''}<button class="btn ghost" style="margin-left:auto" data-close="1">Después</button></div>`)}
 else openDlg(`${bar}<div class="sub">Último paso</div><h2>¿Algo más que quieras anotar?</h2><textarea id="ciNote" rows="3" placeholder="Ej: tuve antojo de dulce en la tarde">${esc(ans.note||'')}</textarea><div class="row"><button class="btn ghost" data-ciback="1">Atrás</button><button class="btn primary" style="margin-left:auto" data-cisave="1">Guardar check-in</button></div>`)}
function notesDialog(id){const e=S.events.find(x=>x.id===id);if(!e)return;openDlg(`<h2>Notas de la cita</h2><div class="sub">${esc(e.title)} · ${fmtDate(e.date)}</div><form id="ntForm" data-id="${id}" class="form" style="grid-template-columns:1fr"><label class="f">¿Qué te dijo el médico?<textarea id="ntSum" rows="3" required>${esc(e.summary||'')}</textarea></label><label class="f">Indicaciones y cambios de medicamentos<textarea id="ntRx" rows="2">${esc(e.rx||'')}</textarea></label><label class="f">Exámenes que te pidió (uno por línea)<textarea id="ntEx" rows="2">${esc(e.orders||'')}</textarea></label><label class="f">Próxima cita o control<input type="date" id="ntNext" value="${esc(e.next||'')}"></label><div class="row"><button class="btn primary">Guardar notas</button><button type="button" class="btn ghost" data-close="1">Cancelar</button></div></form>`)}
const labRow=()=>`<div class="form lbrow" style="grid-template-columns:repeat(auto-fit,minmax(100px,1fr))"><input placeholder="Examen (ej: Ferritina)" class="lbN" aria-label="Examen"><input placeholder="Valor" class="lbV" aria-label="Valor"><input placeholder="Unidad" class="lbU" aria-label="Unidad"><input placeholder="Rango (ej: 30–400)" class="lbR" aria-label="Rango"><select class="lbF" aria-label="Estado"><option value="">Automático</option><option value="ok">Normal</option><option value="alto">Alto</option><option value="bajo">Bajo</option><option value="limite">Límite</option></select></div>`;
function labDialog(){openDlg(`<h2>Cargar resultados de exámenes</h2><div class="sub">Copia cada valor de tu reporte. Si escribes el rango, MAUROMEN marca solo si está alto o bajo.</div><form id="labForm" class="form" style="grid-template-columns:1fr 1fr"><label class="f">Fecha del examen<input type="date" id="lbDate" value="${today()}" required></label><label class="f">Adjuntar PDF o foto<input type="file" id="lbFile" accept="application/pdf,image/*"></label><div id="lbRows" style="grid-column:1/-1;display:flex;flex-direction:column;gap:8px">${labRow()}${labRow()}${labRow()}</div><button type="button" class="btn sm" data-labrow="1" style="grid-column:1/-1">+ Otra fila</button><label class="f" style="grid-column:1/-1">Nota<input id="lbNote" placeholder="Ej: pedido por la deportóloga"></label><div class="row" style="grid-column:1/-1"><button class="btn primary">Guardar resultados</button><button type="button" class="btn ghost" data-close="1">Cancelar</button></div></form>`)}
function autoFlag(v,ref){const x=parseFloat(String(v).replace(',','.'));const m=String(ref).replace(/,/g,'.').match(/([\d.]+)\s*[–-]\s*([\d.]+)/);if(isNaN(x)||!m)return '';const lo=+m[1],hi=+m[2];if(x<lo)return 'bajo';if(x>hi)return 'alto';if(x>hi-(hi-lo)*0.05||x<lo+(hi-lo)*0.05)return 'limite';return ''}
async function uploadAsset(file){const a=await claude.use('assets');if(!a)throw {code:'unavailable'};return a.upload(file)}

 <div><div class="sub" style="margin-bottom:6px">Lo que comí</div>${items.length?`<div class="list">${items.map((i,ix)=>`<div class="li"><div><div class="ttl">${esc(i.n)}</div><div class="meta num">${Math.round(i.k)} kcal · ${r1(i.p)} g proteína</div></div><button class="btn sm ghost" data-rmi="${mid}|${ix}">Quitar</button></div>`).join('')}</div>`:'<div class="empty">Elige un menú o suma porciones abajo.</div>'}</div>
 <div><div class="sub" style="margin-bottom:6px">Menús de tu plan</div><div class="row" style="gap:6px">${m.menus.map((x,i)=>`<button class="btn sm" data-addmenu="${mid}|${i}">${esc(x[0])}</button>`).join('')}</div></div>
 <div><div class="sub" style="margin-bottom:6px">Sumar por porciones</div><div class="row" style="gap:6px">${Object.entries(EX).map(([k,v])=>`<button class="btn sm" data-addex="${mid}|${k}">+ ${esc(v.n)}</button>`).join('')}</div></div>
 <form class="form" id="customForm" data-mid="${mid}"><label class="f">Otro alimento<input id="cName" required placeholder="Ej: empanada al horno"></label><label class="f">kcal<input id="cK" type="number" min="0" required></label><label class="f">Proteína (g)<input id="cP" type="number" min="0" step="0.5" value="0"></label><button class="btn">Agregar</button></form>
 <div class="row"><button class="btn leaf" data-mdone="${mid}">${md.done?'Marcar como pendiente':'Listo, comida cumplida'}</button><button class="btn ghost" style="margin-left:auto" data-close="1">Cerrar</button></div>`)}

/* ======================= ICS (alarmas) ======================= */
const pad=n=>String(n).padStart(2,'0');
function utcStamp(date,time){const [y,mo,d]=date.split('-').map(Number);const [h,mi]=time.split(':').map(Number);const dt=new Date(Date.UTC(y,mo-1,d,h+5,mi));return `${dt.getUTCFullYear()}${pad(dt.getUTCMonth()+1)}${pad(dt.getUTCDate())}T${pad(dt.getUTCHours())}${pad(dt.getUTCMinutes())}00Z`}
function vevent(uid,title,desc,date,time,dur,rrule,alarmMin){const s=utcStamp(date,time);const [y,mo,d]=date.split('-').map(Number);const [h,mi]=time.split(':').map(Number);const e=new Date(Date.UTC(y,mo-1,d,h+5,mi+dur));const es=`${e.getUTCFullYear()}${pad(e.getUTCMonth()+1)}${pad(e.getUTCDate())}T${pad(e.getUTCHours())}${pad(e.getUTCMinutes())}00Z`;
 return ['BEGIN:VEVENT',`UID:${uid}@mauromen`,`DTSTAMP:${utcStamp(today(),'00:00')}`,`DTSTART:${s}`,`DTEND:${es}`,`SUMMARY:${title}`,`DESCRIPTION:${desc.replace(/\n/g,'\\n').replace(/,/g,'\\,')}`,rrule?`RRULE:${rrule}`:'','BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${title}`,`TRIGGER:-PT${alarmMin}M`,'END:VALARM','END:VEVENT'].filter(Boolean).join('\r\n')}
const wrapCal=evs=>['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MAUROMEN//ES','CALSCALE:GREGORIAN','X-WR-CALNAME:MAUROMEN','X-WR-TIMEZONE:America/Bogota',...evs,'END:VCALENDAR'].join('\r\n');
function buildAlarms(){const st=S.settings,start=addDays(today(),1),evs=[];
 MEALS.forEach(m=>{const menus=m.menus.slice(0,3).map(x=>x[0]).join(' / ');evs.push(vevent('meal-'+m.id,`🍽 ${m.name}: ${m.formula.join(' + ')}`,`Meta ≈ ${m.kcal} kcal y ${m.prot} g de proteína.\nIdeas: ${menus}.\nRegístralo en MAUROMEN.`,start,mealTime(m),20,'FREQ=DAILY',0))});
 evs.push(vevent('vit','💊 Vitaminas','Multivitamínico y lo que te formuló el médico. Márcalo en MAUROMEN.',start,MEALS[0].time&&mealTime(MEALS[0]),5,'FREQ=DAILY',0));
 if(st.waterAlarms!==false)['09:00','11:30','15:00','17:30'].forEach((t,i)=>evs.push(vevent('water-'+i,'💧 2 vasos de agua en sorbos','Lejos de las comidas: 30 min antes y después.',start,t,5,'FREQ=DAILY',0)));
 evs.push(vevent('wegovy','💉 Wegovy '+st.wegovyDose+' mg','Aplícala y anótala en MAUROMEN → Agenda.',nextDow(st.wegovyDay),st.wegovyTime||'08:00',10,'FREQ=WEEKLY;BYDAY='+ICS_DAYS[st.wegovyDay],0));
 if((st.gymDays||[]).length)evs.push(vevent('gym','🏋 Gimnasio: fuerza','Fuerza primero. Come tu media tarde antes.',nextDow(st.gymDays[0]),st.gymTime||'18:00',60,'FREQ=WEEKLY;BYDAY='+st.gymDays.map(d=>ICS_DAYS[d]).join(','),30));
 evs.push(vevent('weigh','⚖ Pesarme (en ayunas)','Anota peso y cintura en MAUROMEN.',nextDow(1),'06:15',5,'FREQ=WEEKLY;BYDAY=MO',0));
 S.events.filter(e=>!e.done&&e.date&&e.date>=today()).forEach(e=>evs.push(eventIcs(e)));
 return wrapCal(evs)}
function nextDow(dow){let d=addDays(today(),1);for(let i=0;i<7;i++){if(new Date(d+'T12:00:00').getDay()==dow)return d;d=addDays(d,1)}return d}
function eventIcs(e){const k=(KINDS[e.kind]||KINDS.otro)[0];return vevent('ev-'+e.id,`${k}: ${e.title}`,[e.place,e.notes].filter(Boolean).join(' · ')||k,e.date,e.time||'07:00',e.time?60:30,null,e.time?120:0)}
async function offerFile(name,data){try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data});toast('Archivo listo');return}}catch(e){if(e&&e.code&&e.code!=='cancelled'&&e.code!=='dismissed')toast('No se pudo descargar');else return}
 const out=$('#icsOut')||$('#dlgIn');if(out){out.insertAdjacentHTML('beforeend',`<div class="note">No pude ofrecer el archivo aquí. Copia este texto, guárdalo como <b>${esc(name)}</b> e impórtalo en tu calendario.</div><pre class="ics">${esc(data)}</pre>`)}}

function render(){
 const r=(location.hash||'#hoy').slice(1);
 const views={hoy:vHoy,plan:vPlan,peso:vPeso,agenda:vAgenda,ejercicio:vEjercicio,mas:vMas};
 $('#view').innerHTML=(views[r]||vHoy)();
 if($('#dlg').open&&$('#dlgIn').dataset.mid){}
}
function tick(){const b=bogota();$('#clock').textContent=`${pad(b.h)}:${pad(b.m)}`;$('#dateTxt').textContent=`${DAYS[b.dow]} ${fmtDate(b.date).replace(/^\S+\s/,'')}`}
setInterval(()=>{const before=$('#clock').textContent;tick();if($('#clock').textContent!==before&&(location.hash||'#hoy')==='#hoy'&&!$('#dlg').open)render()},15000);

/* ======================= EVENTOS ======================= */
document.addEventListener('click',async e=>{
 const b=e.target.closest('button,a');if(!b)return;const ds=b.dataset;
 if(ds.close){closeDlg();return}
 if(ds.log){logDialog(ds.log);return}
 if(ds.plan){S.planTab=ds.plan}
 if(ds.ptab){S.planTab=ds.ptab;render();return}
 if(ds.rtab){S.routine=ds.rtab;render();return}
 if(ds.todo){const v=ds.todo;if(v==='profile')profileDialog();else if(v==='checkin'){S.ci=null;checkinDialog()}else if(v==='weigh')location.hash='#peso';else if(v==='agenda')location.hash='#agenda';else if(v==='photo'){const f=$('#phFile');if(f)f.click()}else if(v.startsWith('notes:'))notesDialog(v.slice(6));return}
 if(ds.notes){notesDialog(ds.notes);return}
 if(ds.lab){labDialog();return}
 if(ds.labrow){$('#lbRows').insertAdjacentHTML('beforeend',labRow());return}
 if(ds.ciopt){S.ci.ans[CHECKIN[S.ci.step].k]=ds.ciopt;S.ci.step++;checkinDialog();return}
 if(ds.ciback){S.ci.step=Math.max(0,S.ci.step-1);checkinDialog();return}
 if(ds.cisave){const ans={...S.ci.ans,note:$('#ciNote').value.trim()};const d=structuredClone(day(today()));d.checkin=ans;saveDay(d);S.ci=null;closeDlg();toast('Check-in guardado');return}
 if(ds.doroutine){const r=ROUTINES.find(x=>x.id===ds.doroutine);const d=structuredClone(day(today()));d.exercise=[...(d.exercise||[]),{kind:r.kind,type:r.type,min:r.min}];saveDay(d);toast(r.type+' registrada');return}
 if(ds.quick){const [mid,i]=ds.quick.split('|');const x=MEALS.find(m=>m.id===mid).menus[+i];addItem(mid,{n:x[0],k:x[2],p:x[3]},true);toast(`${x[0]} registrado`);return}
 if(ds.addmenu){const [mid,i]=ds.addmenu.split('|');const x=MEALS.find(m=>m.id===mid).menus[+i];addItem(mid,{n:x[0],k:x[2],p:x[3]});logDialog(mid);return}
 if(ds.addex){const [mid,k]=ds.addex.split('|');const v=EX[k];addItem(mid,{n:v.n,k:v.k,p:v.p});logDialog(mid);return}
 if(ds.rmi){const [mid,ix]=ds.rmi.split('|');const d=structuredClone(day(today()));d.meals[mid].items.splice(+ix,1);saveDay(d);logDialog(mid);return}
 if(ds.mdone){const mid=ds.mdone;const d=structuredClone(day(today()));d.meals[mid]=d.meals[mid]||{items:[]};d.meals[mid].done=!d.meals[mid].done;saveDay(d);closeDlg();toast(d.meals[mid].done?'Comida cumplida':'Marcada como pendiente');return}
 if(ds.water){const d=structuredClone(day(today()));const n=+ds.water;d.water=d.water===n?n-1:n;saveDay(d);return}
 if(ds.toggle){const d=structuredClone(day(today()));d[ds.toggle]=!d[ds.toggle];saveDay(d);return}
 if(ds.hunger){const d=structuredClone(day(today()));d.hunger=+ds.hunger;saveDay(d);return}
 if(ds.delw){await del('weights/'+ds.delw);toast('Pesaje borrado');return}
 if(ds.clrex){const d=structuredClone(day(ds.clrex));d.exercise=[];saveDay(d);return}
 if(ds.new){eventDialog(null);return}
 if(ds.edit){eventDialog(ds.edit);return}
 if(ds.delev){await del('events/'+ds.delev);closeDlg();toast('Borrado');return}
 if(ds.done){const ev=S.events.find(x=>x.id===ds.done);const n={...ev,done:!ev.done};delete n.id;write('events/'+ds.done,n);toast(n.done?'Marcado como hecho':'Reabierto');return}
 if(ds.ics){const ev=S.events.find(x=>x.id===ds.ics);offerFile('mauromen-'+ev.date+'.ics',wrapCal([eventIcs(ev)]));return}
 if(ds.dose){const id='wegovy-'+today();write('events/'+id,{kind:'wegovy',title:`Wegovy ${S.settings.wegovyDose} mg aplicada`,date:today(),time:'',place:'',notes:'',done:true});toast('Aplicación anotada');return}
 if(ds.wset){openDlg(`<h2>Wegovy</h2><form id="wgForm" class="form"><label class="f">Dosis (mg)<select id="wgDose">${[0.25,0.5,1,1.7,2.4].map(v=>`<option ${v==S.settings.wegovyDose?'selected':''}>${v}</option>`).join('')}</select></label><label class="f">Día<select id="wgDay2">${DAYS.map((d,i)=>`<option value="${i}" ${i==S.settings.wegovyDay?'selected':''}>${d}</option>`).join('')}</select></label><button class="btn primary">Guardar</button></form>`);return}
 if(ds.gymday){const i=+ds.gymday;const g=new Set(S.settings.gymDays||[]);g.has(i)?g.delete(i):g.add(i);S.settings.gymDays=[...g].sort();render();return}
 if(ds.saveal){saveSettings();toast('Horarios guardados');return}
 if(ds.dlics){saveSettings();offerFile('mauromen-alarmas.ics',buildAlarms());return}
});
function saveSettings(){const st=structuredClone(S.settings);st.times=st.times||{};document.querySelectorAll('[data-time]').forEach(i=>{if(i.value)st.times[i.dataset.time]=i.value});const wd=$('#wgDay');if(wd)st.wegovyDay=+wd.value;const wt=$('#wgTime');if(wt)st.wegovyTime=wt.value;const gt=$('#gymTime');if(gt)st.gymTime=gt.value;const wa=$('#waterAl');if(wa)st.waterAlarms=wa.checked;S.settings=st;write('settings/main',st)}
document.addEventListener('change',async e=>{if(e.target.id==='waterAl'){S.settings.waterAlarms=e.target.checked;render()}
 if(e.target.id==='phFile'&&e.target.files[0]){toast('Subiendo foto…');try{const r=await uploadAsset(e.target.files[0]);const lw=[...S.weights].sort((a,b)=>b.date.localeCompare(a.date))[0];const doc={date:today(),assetId:r.id,url:r.url};if(lw)doc.kg=lw.kg;S.photos=[...S.photos,doc];write('photos/'+r.id,doc);render();toast('Foto guardada')}catch(err){toast('No se pudo subir la foto')}}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id==='wForm'){const date=$('#wDate').value,kg=+$('#wKg').value,w=$('#wWaist').value;if(!kg)return;const doc={date,kg};if(w)doc.waist=+w;S.weights=[...S.weights.filter(x=>x.date!==date),doc];write('weights/'+date,doc);render();toast('Peso guardado')}
 if(f.id==='exForm'){const k=$('#exKind');const ds=$('#exDate').value||today();const d=structuredClone(day(ds));d.exercise=[...(d.exercise||[]),{kind:k.value,type:k.options[k.selectedIndex].text,min:+$('#exMin').value}];saveDay(d);toast('Ejercicio registrado')}
 if(f.id==='customForm'){const mid=f.dataset.mid;addItem(mid,{n:$('#cName').value,k:+$('#cK').value,p:+$('#cP').value||0});logDialog(mid)}
 if(f.id==='evForm'){const id=f.dataset.id||('e'+Date.now().toString(36));const prev=S.events.find(x=>x.id===id);const doc={kind:$('#evKind').value,title:$('#evTitle').value.trim(),date:$('#evDate').value,time:$('#evTime').value,place:$('#evPlace').value.trim(),notes:$('#evNotes').value.trim(),done:prev?!!prev.done:false};write('events/'+id,doc);closeDlg();toast('Guardado')}
 if(f.id==='prForm'){const pr={...S.profile};PROFILE_FIELDS.forEach(([k])=>{const v=$('#pf-'+k).value.trim();if(v)pr[k]=v;else delete pr[k]});S.profile=pr;write('profile/main',pr);closeDlg();render();toast('Perfil guardado')}
 if(f.id==='ntForm'){const id=f.dataset.id;const ev=S.events.find(x=>x.id===id);const n={...ev,summary:$('#ntSum').value.trim(),rx:$('#ntRx').value.trim(),orders:$('#ntEx').value.trim(),next:$('#ntNext').value,done:true};delete n.id;write('events/'+id,n);
  n.orders.split('\n').map(s=>s.trim()).filter(Boolean).forEach((o,i)=>write(`events/ord-${id}-${i}`,{kind:'examen',title:o,date:'',time:'',place:'',notes:'Pedido en: '+ev.title,done:false}));
  if(n.next)write(`events/ctrl-${id}`,{kind:'cita',title:'Control: '+ev.title.split(' – ')[0],date:n.next,time:'',place:ev.place||'',notes:'',done:false});closeDlg();toast('Notas guardadas')}
 if(f.id==='labForm'){(async()=>{const date=$('#lbDate').value;const items=[...document.querySelectorAll('.lbrow')].map(r=>{const n=r.querySelector('.lbN').value.trim(),v=r.querySelector('.lbV').value.trim(),u=r.querySelector('.lbU').value.trim(),ref=r.querySelector('.lbR').value.trim();let fl=r.querySelector('.lbF').value;if(!fl)fl=autoFlag(v,ref);if(fl==='ok')fl='';return n&&v?{n,v,u,ref,flag:fl}:null}).filter(Boolean);
  if(!items.length&&!$('#lbFile').files[0]){toast('Escribe al menos un resultado');return}
  const prev=S.labs.find(l=>l.date===date)||{};const doc={date,items:[...(prev.items||[]),...items],note:$('#lbNote').value.trim()||prev.note||''};
  const file=$('#lbFile').files[0];if(file){toast('Subiendo reporte…');try{const r=await uploadAsset(file);doc.fileId=r.id;doc.fileUrl=r.url}catch(err){toast('No se pudo subir el archivo; guardo los valores')}}else if(prev.fileUrl){doc.fileId=prev.fileId;doc.fileUrl=prev.fileUrl}
  write('labs/'+date,doc);closeDlg();toast('Resultados guardados')})()}
 if(f.id==='wgForm'){S.settings={...S.settings,wegovyDose:+$('#wgDose').value,wegovyDay:+$('#wgDay2').value};write('settings/main',S.settings);closeDlg();render();toast('Wegovy actualizado')}
});

/* ======================= ARRANQUE ======================= */
nav();tick();render();
(async()=>{
 const syncEl=$('#sync');const timer=setTimeout(()=>{syncEl.textContent='Sin conexión todavía';},10000);
 let db=null;try{db=await claude.use('db')}catch(e){}
 if(!db){clearTimeout(timer);syncEl.textContent='Solo lectura';$('#view').insertAdjacentHTML('afterbegin','<div class="note">Abre MAUROMEN con tu cuenta de claude.ai para guardar tus datos.</div>');return}
 S.db=db;let first=true;
 const ok=()=>{clearTimeout(timer);syncEl.textContent='Sincronizado'};
 const fail=()=>{clearTimeout(timer);syncEl.textContent='Error de conexión'};
 db.collection('logs').orderBy('date','desc').limit(120).onSnapshot(s=>{S.days={};s.docs.forEach(d=>{S.days[d.id]={...emptyDay(d.id),...d.data()}});if(!s.metadata.fromCache)ok();if(!$('#dlg').open)render()},fail);
 db.collection('weights').onSnapshot(s=>{S.weights=s.docs.map(d=>({date:d.id,...d.data()}));render()},fail);
 db.collection('events').onSnapshot(s=>{S.events=s.docs.map(d=>({id:d.id,...d.data()}));if(!$('#dlg').open)render()},fail);
 db.doc('profile/main').onSnapshot(s=>{S.profile=s.exists?{...s.data()}:{};render()},fail);
 db.collection('photos').onSnapshot(s=>{S.photos=s.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
 db.collection('contacts').onSnapshot(s=>{S.contacts=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));render()},fail);
 db.collection('labs').onSnapshot(s=>{S.labs=s.docs.map(d=>({date:d.id,...d.data()}));render()},fail);
 db.doc('settings/main').onSnapshot(s=>{if(s.exists)S.settings={...S.settings,...s.data()};render()},fail);
})();
</script>
